      ### 第 0.7 条：网络链路与 403/404 判断铁律（worker 提示词必含）

      > **实战教训**：多轮撞墙全部是误判——worker 把目标 404、扫描链路正常响应当成"CF 拦截/环境墙"标 blocked。
      > 实测结论（2026-08-06）：WSL 扫描链路**完全正常**，`mcp.opensea.io/robots.txt` 返回 200。

      **① WSL 网络链路实况（不要改动）**
      - WSL 必须走 Clash（Mihomo）TUN 才能出网，DNS 返回 fake-ip（198.18.x.x）是**正常必经通道**
      - **不要加 real_ip/DoH 直连**：WSL 内真实 IP 直连通常无法出网（被 TUN 拦截）
      - 工具链（nuclei/httpx/sqlmap/dalfox 等）**直接扫域名即可**，链路本身是通的
      - **000 判定统一口径**：探路命令返回 000 / curl 失败 / exit≠0 → **一律先按网络故障处理**（等 30s 重试、查 Clash 是否运行），不得视为链路正常

      **② 判断目标是否可达（扫描遇 403/404/000 时先做）**
      ```bash
      curl -sk -m 8 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
        "https://<目标>/robots.txt" -o NUL -w "HTTP %{http_code}"
      ```
      | 结果 | 含义 | 处置 |
      |------|------|------|
      | 200 | 链路通、目标可达 | 目标路径 404 = **正常无此路由** → 换真实端点 |
      | 403/503 + CF challenge | 真被拦截 | **先走第 0.11 条 CF/Turnstile 专项链，禁止直接归因环境/换 IP** |
      | 000 | 网络不通 | 等 30s 重试；持续 000 → 检查 Clash 是否运行 |

      **③ 关键判定（防误判）**
      - 目标 404 ≠ 被拦截 ≠ 环境墙 —— **404 是正常业务响应**（根路径常无路由）
      - 只有明确的 CF challenge（403/503 + `__cf_bm` cookie 重定向）才是真拦截，且真拦截也按第 0.11 条处理
      - **禁止**把"全部 403/404/000"笼统标 blocked=environment；先探路判定再决定
      - 探路成功（200）但扫描 0 发现 → 记录"已验证无漏洞"，换下一个攻击面，不标 blocked

