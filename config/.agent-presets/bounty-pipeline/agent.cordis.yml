      > 粘贴到**任意客户端 / 任意新对话**第一条消息即可启动一轮多平台赏金实战
      > （Codex / Qoder / Hermes / Claude Desktop / Claude CLI / Pi / WorkBuddy 桌面端均可）。
      > **v11 核心升级（对 v10 的三包实战验证（JET/OpenSea/Chime，2026-08-17）+ 用户硬性要求）：**
