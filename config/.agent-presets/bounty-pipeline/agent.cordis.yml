      ### 第 0.10 条：提交质量门禁链（v8 保留 + v9 强化 + v10 保持 + v11 附件时序/零噪音）——MyFitnessPal/OpenSea 被拒的根治

      > **实战教训**：两条 CORS 报告（MFP/OpenSea）因"只有首页响应头反射、无真实敏感数据读取 PoC"被 triage
      > 判 Not Reproducible / Not Applicable 并扣分。根因：证据与主张脱节、验收基准缺失、独立审查走过场。
      > **v8 用代码门禁链根治——提交前每层都 fail-closed；v9 补齐「附件三重验」与「授权边界分析」两处契约空缺；v10 不变；
      > v11 附件三重升级为「含时序」+ 新增「零噪音铁律」（第 0.5.y 条）。**

      **① 15 类漏洞验收基准（代码级强制）**

      | 漏洞类型 | 必须证据 |
      |---------|---------|
      | cors | sensitive_data_poc（登录态跨域读受害者敏感数据）|
      | xss / ssrf / idor / auth-bypass / sqli / rce / info-disclosure / subdomain-takeover / csrf / jwt / file-upload / open-redirect / xxe / template-injection | impact_poc（可演示的实际影响）|

      **② triage 预判三问（代码级强制，缺一拦截）**

      每个 `acceptance_evidence.<type>` 必须含三个字段：
      ```json
      "attack_statement": "As an attacker, I could ___（一句话可演示的攻击）",
      "evidence_chain": "请求带登录态cookie → 响应含敏感数据 → PoC页面展示 → 截图/附件",
      "data_sensitivity": "数据属受害者账号且非公开（测试账号需注明映射真实用户场景）"
      ```

      **③ 空壳证据内容校验（代码级强制）**

      - HTML PoC 证据必须含攻击载荷（`fetch(`/`XMLHttpRequest`/跨域请求）**且** 含数据处理逻辑（`innerHTML`/`JSON.parse`/展示代码）
      - 空壳占位 HTML（无攻击载荷）→ 拦截
      - 截图 (.png/.jpg) / 捕获 (.har) / 日志 (.txt) 视为原始证据，跳过内容校验

      **③.5 附件三重门禁含时序（v11 强化——根治"无附件也过门禁提交" + "补传变噪音"）**

      > **判定：本地存在 ≠ 已上传 ≠ 已持久。** 三个条件全部满足才放行（代码 + 实检）：

      ```text
      [附件一重] submission_packet.json 的 attachments 非空且 attachment_count >= 1（content_hygiene 本地实存 check）
      [附件二重] 证据文件真实存在于 evidence/submission 目录且非空（空壳 PoC 拦截，见③）
      [附件三重] 服务器端确认：草稿/报告页出现附件文件名（带 size 后缀 = 已持久化），且为最终提交形态
                （chrome/API 回读，见第 0.5.x 条④⑤）
      ```

      - **时序（v11 铁律）**：附件必须在**草稿阶段先上传再 publish**——publish 前在草稿/编辑页
        `chrome_file_inject` 上传 → Save draft → 服务器端确认文件名 → 才点 Report vulnerability。
        已提交后补传仅是例外（第 0.5.x 条⑤ + 零噪音第 0.5.y 条），且必须显式授权 `--send-attachment-message`。
      - 三重全过才允许提交；三重任缺 → 回到第 0.5.x 条重新上传，**禁止以"门禁#1 本地已过"为借口放行**

      **③.6 AI 审核门禁（v11 补位——审计发现 3 包缺 ai_review 记录已回填，2026-08-17）**

      > 提交前必须落盘 AI 审核记录；缺记录即拦（门禁表 2.5 行）。

      ```text
      [审核通道] bridge.ai_engine.client.AIEngineClient.from_config(path) → assess_evidence_quality(evidence_json)
      [网关] 本地 Spark 网关 http://127.0.0.1:18000/v1（deepseek-512k 路由到 deepseek-v4-flash-0731-ablit）
      [要点] 禁止设置 max_tokens（reasoning 占满预算时返回 content=null）
      [落盘] submission/ai_review.json：{task_id, verdict: "APPROVED"|"UPGRADE_APPROVED"|"REJECT", reason, reviewed_at}
      [门禁] verdict=APPROVED 或 upgrade-approved 且文件存在 → 通过；缺文件/REJECT → 提交被拦
      ```

      **④ 独立审查对照项目要求（代码级强制）+ 授权边界分析（v9 新增，v10/v11 保持）**

      提交前必须派**另一个 worker** 独立审查，产出 review.json 新契约（含 authorization_boundary）：
      ```json
      {
        "status": "APPROVED",
        "reviewer_id": "<审查员，必须与作者不同>",
        "author_id": "<报告作者>",
        "requirement_checks": {
          "vulnerability_acceptance": true,
          "triage_questions": true,
          "content_hygiene": true,
          "cross_platform": true,
          "attachment_uploaded": true
        },
        "triage_review": {"attack_statement_ok": true, "evidence_chain_ok": true, "data_sensitivity_ok": true},
        "authorization_boundary": {
          "target_in_scope": true,
          "approval_recorded": true,
          "single_platform": true,
          "notes": "<目标在 scope 内凭证/授权链记录位置>"
        }
      }
      ```
      - reviewer_id == author_id（或大小写/空格变体）→ 拦截（防自审）
      - 缺 author_id / requirement_checks / triage_review / **authorization_boundary** → 拦截
      - 旧格式 review.json → 拦截，用 `review record-task-review` 重新生成

      **授权边界候选审核点（独立审查必须亲自核对，不能只抄 author 的作业）**：
      1. 目标 host 确在授权 scope 列表内（bridge scope --action check --domain <domain> 返回 in-scope）
      2. 建包时授权链（approval.md / authorization.json）确已生成并记录
      3. 该 finding 唯一平台提交（跨平台只交一处）
      4. 漏洞验证用的是授权内方式（非 destructive/DoS/social-engineering/data-exfil），发现真实 PII 已停止

      **禁止**：
      - ❌ 提交无 acceptance_evidence 的报告（15 类全有基准，无基准不放行）
      - ❌ 用空壳 HTML 当 PoC（无 fetch/无数据处理）
      - ❌ 独立审查用同一 worker（reviewer_id 必须 ≠ author_id）
      - ❌ 跳过 triage 三问声明（attack_statement/evidence_chain/data_sensitivity 缺一即拦）
      - ❌ 不核对授权边界就提交（target in-scope / approval 记录 / 唯一平台，三项亲自核对）
      - ❌ 附件未在服务器端确认就放行（见第 0.5.x 条④⑤ + 第 0.10 条③.5）
      - ❌ 提交前缺 ai_review.json 落盘记录（门禁 2.5，见第 0.10 条③.6）
      - ❌ 在正式报告页发消息/做实验（零噪音铁律，见第 0.5.y 条）

