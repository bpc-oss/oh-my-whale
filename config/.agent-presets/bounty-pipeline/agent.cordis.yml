      ### 第 0.5.x 条：自主上传附件专项 SOP（根治"不能/不会自主上传""无附件也提交"双事故）

      > **判定：本地存在 ≠ 已上传。** 上传 = 唯一合规通道 `chrome_file_inject`；服务器端见附件名才算完成。

      ```text
      # 上传 4 步（每步都要做，缺一步不算完成）
      [Step 1] 用 chrome_locator 定位页面 file input 元素：
               button/input[type=file]/dropzone（Bugcrowd: "Attach files" / "Evidence"；Intigriti/API 见②）
      [Step 2] MCP: chrome_file_inject {profileName:"报平", tabId:<当前标签>, inputSelector:"<file input 选择器>", filePaths:["<绝对路径证据文件>"]}
      [Step 3] 查验 DOM：文件名字符串必须出现在页面上（chrome_locator innerText）
      [Step 4] 截图存证：chrome_screenshot 保存到 submission/ 目录（肉眼可见文件名）
      ```

      **② 无原生 file input 时的直连通道**：
      - 平台若提供 JSON API 上传端点 → 走 API 直连上传，然后在服务器端草稿/报告页验证附件名出现；
      - 不要死磕前端表单（AGENTS.md 教训：优先找平台 API 直连路径）。

      **③ 附件准备**：evidence 文件须真实存在且非空（空壳 PoC 拦截）。

      **④ 判定：什么才算"附件已上传"**
      - ❌ 本地 evidence/submission 目录有文件 ≠ 已上传
      - ❌ 前端 chips 出现 ≠ 已上传（**chips 只是前端队列**，reload 后消失，2026-08-17 实测）
      - ✅ 只有 **服务器端草稿页（Save draft 持久）或已生成报告页（Send message 持久）上出现该附件文件名** 才算上传成功

      **⑤ 时序铁律（v11 新增，用户硬性要求，不可违）**：
      - **附件必须草稿阶段先上传再 publish**：publish 前在草稿/编辑页 `chrome_file_inject` 上传 → Save draft →
        服务器端确认文件名出现 → 才点 Report vulnerability。
      - **已提交后补传仅是例外**：报告页 chips 只是前端队列，必须输入说明 + **Send message** 才会真正 POST
        （只注入不发送，reload 后附件消失）。
      - 补传例外前置条件：① 确实是草稿阶段漏传的核心证据；② 显式授权（`--send-attachment-message`）；
        ③ 单条说明消息，发完即止。

