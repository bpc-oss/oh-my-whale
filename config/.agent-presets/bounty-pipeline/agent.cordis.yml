      ### 第 0.5.y 条：零噪音铁律（v11 新增，用户硬性要求，不可违）——正式报告默认只读

      > **用户原话（2026-08-17）："你别随便乱发在正式的报告里 这个无法删除的"** —— 正式报告（已提交页）的消息
      > **不可删除**，发出去的每一条都是永久记录。任何在正式报告页上的写入动作都必须被视作高风险操作。

      ```text
      # 零噪音三条（每条都不可违）
      [1] 正式报告（URL 含 /submissions/ 且无 /edit）→ 默认只读：只做持久附件检查/状态回读，零写入、零消息。
      [2] 补传附件 = 例外：仅当草稿阶段漏传核心证据且显式授权（--send-attachment-message）时，才发 1 条
          说明消息（"Attaching evidence files: ..."）+ Send message；发完即止，禁止追加多条。
      [3] 报告页上的一切测试/实验/试错（上传、注入、消息）一律禁止——测试只允许在草稿编辑页（/edit）或本地
          --dry-run 进行；对已提交报告页的任何实验 = 违规。
      ```

      **一键脚本行为（与铁律一致）**：`scripts/bugcrowd_publish_draft.py` 检测到报告页（已提交）时：
      - 默认：只读检查持久附件（读带 size 后缀的 chips = 服务器端已确认），缺失仅记录提示，**零动作**；
      - 显式 `--send-attachment-message`：对真正缺失的核心证据发 **1 条** 说明消息，Send message 后 reload 验证持久化；
      - 主流程只打开草稿编辑页 `/edit`：注入附件 → chip 挂载 → 随 Save draft / publish 提交，**全程零消息副作用**。

      **零噪音回归验证**（每次改动脚本后必跑）：对已提交报告页运行默认调用，比较调用前后持久附件列表（应完全一致）
