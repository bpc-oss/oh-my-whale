      ### 第 0.5 条：浏览器会话铁律 + 登录恢复 SOP（worker 提示词必含）

      > **实战教训（v8/v9）**：worker 遇到会话问题让用户手动登录——严重失误。
      > **v10 新事实（2026-08-15 实测）**：Bugcrowd 的 Okta SSO 会话**会过期**（约 2 天），但**重登完全可自动化**。

      **铁律：遇到任何"浏览器会话/登录态/验证码/上传附件"问题，第一步永远是 agentos-chrome-cdp，不是找用户。**

      ```text
      # agentos-chrome-cdp 合规通道（浏览器控制唯一入口，逐条照做）
      # 1. 启动报平 profile（幂等，不丢标签页） MCP: chrome_profile_start {profileName: "报平"}
      # 2. 列出标签页看各平台          MCP: chrome_tabs {profileName: "报平", action: "list"}
      # 3. 点击/填写/等待             MCP: chrome_locator / chrome_cdp(Runtime.evaluate)
      # 4. 上传附件（唯一合规通道）     MCP: chrome_file_inject（见第 0.5.x 条，禁止系统文件选择器）
      # 5. 截图存证                 MCP: chrome_screenshot（提交后必截，存证到 submission/）
      # 6. 会话结束                 MCP: chrome_session_v2 {action: "finalize"}
      ```

      **Bugcrowd 登录恢复 SOP（2026-08-15 实测，全自动可执行）**：
      1. 判断过期：CDP 打开 `https://bugcrowd.com/dashboard`，若跳转到 `login.hackers.bugcrowd.com/oauth2/...` = Okta SSO 过期。
      2. 用 agentos-chrome-cdp **新开 `about:blank` tab 再 navigate** 到 `https://login.hackers.bugcrowd.com`
         （⚠️ 不要用 chrome_tabs action=new 直接带 URL——Okta 重定向会让 MCP 回滚关闭 tab）。
      3. 邮箱已预填 `s1015341084@gmail.com` → 点"下一步" → 密码页输入 `Bc!rc2026-Fb#001`
         （凭据见 `data/platform_sync/bugcrowd/browser_session.json`）→ 点"验证"。
      4. MFA：**Windows Hello 硬件认证器**（2026-08-15 已注册"安全密钥或生物特征识别身份验证器"），用户在系统侧确认；
         若提示 Google Authenticator TOTP 而 Windows Hello 未注册 → 才需用户一次 6 位码。
      5. 成功标志：`https://bugcrowd.com/dashboard` 不再跳登录。
      6. 成功后更新 `browser_session.json` 的 `last_authenticated_at` / `auth_state`（CDP 实测为准）。

      **判定标准（防误判会话过期）**：
      - 先 `chrome_profile_start` 启动 profile → 再 `chrome_tabs` 列标签页 → 按标题判断
      - **不要只读 browser_session.json 文件声明就判断过期**（文件可能是旧的）
      - 判过期 → 按上面 SOP 重登；CDP 不可用 → 重启 bridge-server 再试
      - **只有 CDP 彻底不可用且重启失败，才允许向用户求助**

      **禁止（browser-control 硬禁清单）**：
      - ❌ 让用户手动登录/重启 Chrome（除非 CDP 通道彻底不可用且重启失败）
      - ❌ 只读 session 文件就下"会话过期"结论
      - ❌ 把"会话问题"当阻塞标 blocked（先 CDP 验证再说）
      - ❌ 自己写原始 CDP 命令 / 复制 profile / 杀掉 Chrome 进程 / 绕过 agentos-chrome-cdp 直连 9333
      - ❌ 用系统文件选择器上传附件（必须 `chrome_file_inject`）

      **已失效通道备忘（勿再浪费时间）**：
      - "解锁帐户"邮件路径：账户**未锁定**时只发通知**不发验证码**（2026-08-09 实测）→ 死路。
      - Gmail API（email_connector.search_emails）：refresh token 已失效（invalid_grant，2026-08-15 实测）
        → 读邮件一律走**浏览器 Gmail tab**（报平 profile 已登录）。

