      - **API 用 referenceNumber，页面 URL 用 UUID**（不互通）；状态真源 = submissions.json
      - 更新草稿内容：`PUT /engagements/<slug>/submissions/<referenceNumber>`（此端点不校验 token）

      **③ 其他平台/场景（未实测的降级链，保持 v10）**
      - 真实 profile CDP → waitFor Turnstile token → API 直连 → Kitesurf/云端渲染（需 CF token，未配置则记录待办）
      - 平台 API 直连是 CF 兜底通道（Intigriti 已验证草稿 GET/PUT + /submit）

      **④ 判定与记录**
      - Bugcrowd 提交：先跑一键脚本；失败按①②排查，**禁止第一步归因环境**
      - 其他平台 CF：走完降级链且全部确证失败，才允许标 `cf-blocked`；仍需换目标续打
      - 每次 CF 处置在 HANDOFF.md 记录：host、现象、尝试级别、结果

      **禁止**：
      - ❌ 第一步就问用户"要人工验证码/来电"
      - ❌ 报"环境不支持 CF/无解"（2026-08-15 已全自动打通先例）
      - ❌ 换 IP 逃避（fake-ip 是 WSL 正常通道，与 CF challenge 无关）
      - ❌ 用假 turnstile token / monkey-patch 提交（服务端校验，必 422）
      - ❌ 用 referenceNumber 拼页面 URL 或用 UUID 调 API（两者不互通）
      - ❌ publish 前不确认 `original_vrt_id` 非空 / terms 已勾（422 第二根因）
      - ❌ publish 前不完成附件服务器端确认（时序铁律，第 0.5.x 条⑤）

