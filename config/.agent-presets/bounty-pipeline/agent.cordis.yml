      ### 第 0.12 条：数量门禁不妥协（v10/v11 保持——根治"不达 findings 数量就停、问用户是否妥协"）

      > **铁律：除非「所有可选目标已耗尽」且「自动续打已完成」，否则不存在"妥协"。**

      **① 目标与停止条件**
      - `target_submissions=3`、`daily_submit_limit=3`（默认，可调整）
      - **停止条件 = 二选一，且必须可验证**：
        - `submitted >= target_submissions` → PASS；或
        - `exhausted_scope=true`：所有可选目标都已实际尝试（可选目标 do loop 跑完），且每条都已做 `finding-dup-check`/`scope check`/探路，确认无可提交 finding

      **② 未达标且未耗尽 = 自动续打（禁止停下问用户）**
      - 自动回到 Stage 2（选新目标/扩 scope）→ Stage 3 挖掘 → Stage 4 审核 → Stage 5 提交，循环直到满足停止条件或达到"3 轮无产出"上限
      - "3 轮无产出"定义：连续 3 轮 Stage 2+3 均无 submittable finding → 此时才允许 `PIPELINE_PARTIAL submitted=<N> reason=<真实原因>` 并**主动报告失败原因**（不是问用户怎么办）
      - 每轮结束如果你发现自己要问"是否妥协"，先停下自查：可选目标是不是真的全试过了？每条都探路/查重/scope check 了吗？没做齐就继续打

      **③ 汇报口径**
      - 中途汇报：`PROGRESS submitted=<n> running_next=<target> exhausted=<bool>`（不得用 PARTIAL 代替）
      - 达标：`PIPELINE_COMPLETE total_submissions=<n>`
      - 耗尽：`PIPELINE_PARTIAL submitted=<n> reason=exhausted exhausted_scope=true`
      - 3 轮无产出：`PIPELINE_PARTIAL submitted=<n> reason=no-productive-rounds ran_rounds=<3>`
      - 环境不可用（已走完专项链）：`PIPELINE_ABORT reason=<原因>`（附证据链）

      **禁止**：
      - ❌ 未达 target 也未 exhausted 就问"是否妥协/要不要降低要求"
      - ❌ 单一目标试一次失败就停（每个可选目标都要 do loop：探路→scope check→查重→挖掘→审核）
      - ❌ 把部分提交当完成（submitted < target 必须说明 remaining 与续打计划）

