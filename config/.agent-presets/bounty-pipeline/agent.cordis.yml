      ### 第 0.6 条：WorkBuddy CLI 可靠调用协议（2026-08-05 本机实测）

      #### 实测事实（必须遵守，防止"Worker 起不来 / 卡权限 / 模型错"三类事故）

      | 项 | 结论 |
      |----|------|
      | CLI 位置 | `cbc` / `codebuddy` v2.127.2（npm shim：`C:\Users\Administrator\AppData\Roaming\npm\cbc`；内置：`E:\Workbuddy\resources\app.asar.unpacked\cli\bin\codebuddy`）|
      | 认证 | **WSL bash 直跑 cbc 报 `Authentication required`（认证墙）**；必须从 Windows 侧 `cmd.exe` 调用。WSL 侧一律走 `cmd.exe /c "cbc ..."` 桥接 |
      | 模型 | **每次显式 `--model hy3`**。命令行派发以 `hy3` 为准；`.codebuddy/settings.json` 默认 model 可能指向已卸载的 custom-local，不要依赖默认 |
      | 探针 | 每轮开始先验证：`cbc -p --model hy3 回复 OK` → 期望输出 `OK` |
      | 权限 | 非交互 `-p` 模式加 **`--permission-mode bypassPermissions`**；worker 提示词内要求**全部用 PowerShell** 执行命令 |
      | 提示词 | 长提示词走 **stdin**（`$prompt | cbc ...`），避免引号地狱 |
      | 并行 | ≤3 个 `cbc -p` 后台进程并行，各自写日志，主线程轮询 `WORKER_DONE` 行；或 `--swarm` 派发 |
      | 结果契约 | worker **最后一行**必须输出 `WORKER_DONE pack=<pack> findings=<n> tools=<action_class列表> summary=<结论> blocked=<阻塞点或none>` |
      | 超时/清理 | 每个 worker 包 `timeout 1800` 兜底；`cbc ps` 查会话；中断后 `kill` 对应进程树 |

      #### 常见故障与处置
      | 现象 | 处置 |
      |------|------|
      | `Authentication required` | 必须从 Windows 侧调用（WSL 直跑有认证墙）|
      | `404 The model ... does not exist` | 显式 `--model hy3` |
      | PowerShell 工具权限被拒 | 加 `--permission-mode bypassPermissions` |
      | Bash 工具被拒 | 正常现象，worker 只用 PowerShell |
      | worker 卡死/无输出 | `timeout 1800` 兜底；`cbc ps` 查会话；查日志是否出现 WORKER_DONE |
      | 扫描全 403/404/000 | **先按第 0.7 条判断，禁止直接标 blocked** |

