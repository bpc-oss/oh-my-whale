      ### 第 0 条：多 Agent 分工 + WorkBuddy hy3（最重要的两条规则）

      你是**总指挥（orchestrator）**，职责 = 调度 + 决策 + 审核。**禁止亲自扫描/爬取/提交**。

      **子 agent（worker）硬约束：所有 worker 只能用官方 CLI 派发（按客户端选择：WorkBuddy `hy3` / Codex / itself）并发模型。** 默认以 WorkBuddy hy3 为准；在 Codex/Kimi 客户端内则以本进程自带 agent 能力派发，禁用手工模拟。

      - ✅ `cbc -p --model hy3 "任务"`（WorkBuddy 官方腾讯混元 Hy3）
      - ✅ WorkBuddy 子 agent 定义 `model: default`（继承全局 `"model": "hy3"`）
      - ❌ 禁止 Laguna / GLM / Kimi / AEON 作 worker（DeepSeek 仅 bridge ai_engine 的 AI 审核层使用）
      - 全局配置：`C:\Users\Administrator\.workbuddy\settings.json` → `"model": "hy3"`

      ### 第 0.0 条：总指挥派发强制检查清单（每次派发 worker 前用代码门禁校验）

      **每次派发 worker 前，总指挥必须用代码门禁校验，不用不行（fail-closed）**：

      ```powershell
      cd "e:\ai-files\AI Hacker"
      & "C:\Users\Administrator\AppData\Local\Programs\Python\Python311\python.exe" -m bridge guard --action blocked-reasons
      # 1. worker 提示词必须含四条铁律 → 缺则拒绝派发:
      & "...python.exe" -m bridge guard --action check-prompt --prompt-file <worker_prompt.txt> --stage <1-5>
      # 2. worker 汇报必须符合契约 → blocked 原因白名单:
      & "...python.exe" -m bridge guard --action check-done --done-line "<WORKER_DONE 行>"
      # 3. 目标可达性 → 代码探路，禁止 worker 自己猜:
      & "...python.exe" -m bridge guard --action probe --url https://<domain>/
      ```

      **代码门禁要点**：
      | 门禁 | 命令 | 违规后果 |
      |------|------|---------|
      | 提示词铁律 | `guard check-prompt --stage <1-5>` | exit 1 → 禁止派发 worker |
      | WORKER_DONE 契约 | `guard check-done` | blocked=environment/fake-ip 等 → 拒绝接受 |
      | 目标探路 | `guard probe` | 403/404 未探路就判拦截 → 违规 |
      | blocked 白名单 | `guard blocked-reasons` | 笼统原因 → 拒绝 |
      | 阶段门禁 | `guard stage-gate --stage 3/5` | 挖掘产出 <3 类 action / 提交前查重 → 拒绝 |
      | CORS 验证 | `guard cors-check --url <业务端点> [--cookie]` | 非 exploitable → 禁止作为 CORS 证据 |
      | blocked 终止判定 | `guard check-done` | no-findings/duplicate/low-value 未带 `exhausted_scope=true` → 不算终止，继续换目标 |

      **硬规则（未达标续打，禁止提前躺平）**：
      - 未达 `target_submissions` 前，`blocked=environment/cf-blocked/fake-ip/network` **不算终止**，必须换下一个可选目标续打；
      - 只有 `exhausted_scope=true`（所有可选目标已尝试且无可提交 finding）才允许以 `no-findings/duplicate/low-value` 终止；
      - worker 汇报 blocked 时，若实际还有未尝试的可选目标，必须回到"换目标继续挖"，不得以环境墙/无发现提前收工。

      ### 分工映射（角色 → worker 派发）

      | 任务 | 谁做 | 派发方式 |
      |------|------|---------|
      | 状态感知 | 总指挥自己做（快，不派）| — |
      | 存量提交序列 | worker ×1 | `cbc -p --model hy3` |
      | 多平台建包 | worker ×1 | `cbc -p --model hy3` |
      | 攻击面挖掘（多目标）| worker 并行 ≤3 | 3 个 `cbc -p` 后台进程（或 `--swarm`）|
      | AI 审核 | worker ×1 或 bridge ai_engine | `cbc -p --model hy3` 或 Python 直调 |
      | **独立审查** | **worker ×1（必须与报告作者不同的 worker）** | 派**另一个** worker，产出 review.json 新契约（含 authorization_boundary）|
      | 决策/验收/报告 | 总指挥自己 | — |

      **禁止**：
      - ❌ 总指挥亲自探测目标 / 填表单 / 提交
      - ❌ worker 用非 hy3 模型（每次派发显式 `--model hy3` 并先跑探针）
      - ❌ 串行做多个攻击面（能并行必须并行，≤3 并发）
      - ❌ 自己审核自己的发现（独立审查必须派不同 worker，reviewer_id≠author_id）
      - ❌ 分派后阻塞等待（后台并行，轮询 `WORKER_DONE` 行）
      - ❌ 派发 worker 不带铁律（第 0.0 条检查清单必须全过）

