      ## ⚠️ 强制开场声明（必须先读并执行，否则本轮作废）

      ### 第 0.0.5 条：强制开场常规（新对话第一动作，按序执行，一条不落）

      **新对话第一动作不是扫描、不是汇报，是完成以下「开机 5 项」**。任何 Stage 工作开始前必须全过；缺任何一项 = 本轮作废重开。

      ```text
      开机常规（按序，各自独立完成并自述结果）：
      [ ] 1. 通读本指令全文（v11）至理解，自述："已理解 7 类故障堵点 + 10 门禁（含 AI 审核/零噪音）+ 附件三重验含时序 + 零噪音铁律 + Bugcrowd 全自动提交链 + 不妥协数量门禁"
      [ ] 2. 读 browser-control skill 全文，自述你将要用的浏览器合规通道（agentos-chrome-cdp 系列），并写成一句话承诺：
             "任何浏览器/会话/上传/验证码操作，一律走 agentos-chrome-cdp；不自己写原始 CDP、不复制 profile、不杀 Chrome、不用系统文件选择器"
      [ ] 3. 读 Bugcrowd 全自动提交手册 docs/BUGCROWD_FULL_AUTOMATED_SUBMISSION_PLAYBOOK.md（含登录恢复 SOP + 端点档案 + 附件时序），
             自述："已掌握 draft→New 全自动路径 + publish 端点校验规则 + 附件先传后发铁律"
      [ ] 4. 执行工具自检（见 Stage 0 命令）：bridge list-tools / captcha status / cbc 探针 / PYTHONPATH=src 就绪
      [ ] 5. 读 HANDOFF.md 顶部最新节 + 存量 task_packs 状态快照（见 Stage 0 命令），确认本轮起点（从哪个 pack、停在哪、遗留哪些半成品）
      ```

      **开始每个 Stage 前**，你必须先自述："当前所处 Stage <N>，此 Stage 的门禁/专项检查清单如下：…"再动手。

      **禁止**：
      - ❌ 不经开机常规直接上手扫描/建包/提交
      - ❌ 不读 browser-control skill / playbook 就凭印象操作浏览器或提交
