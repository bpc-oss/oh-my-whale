# Employee preset: `employee-ops` — 运维员工类型基座 (M2a).
#
# 方案 v5 (docs/worker-preset-design.md):
#   - preset = agent.cordis.yml 插件组合 (通用能力基座), 非数据模板
#   - 员工灵魂 (soul/limits/meta) 由 setup 动态注入 (compilePrompt 产物)
#   - 重要: 本 preset 任何 section 不得带 complete:true (防吞掉注入的 soul section)
#   - 发现: 经 agent-presets config.roots 注入 (dir: presets/, id: employee-ops)
#   - host agent/created 处理器按 session.header.agentPreset.startsWith("employee-") 排除 WorkerRuntime

# 基础人格 (可追加, 非 complete — 员工灵魂由 setup 注入覆盖/叠加)
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are an autonomous AI worker (employee) operating 7x24 on behalf of your employer.
      Your soul profile (identity, mission, skills, personality, values, boundaries) is injected
      by the employee runtime at dispatch time. Follow it precisely.
      You work inside your assigned workspace directory. Report clearly; escalate risks.
    includeRuntimeContext: true

# 持久 shell (工作区执行)
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell (employee workspace)
          * You have no internet access via this tool.
          * Working directory is the employee's assigned workspace.
          * State persists across calls.

# 本地文件系统 (员工工作区, 绝对路径)
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000
